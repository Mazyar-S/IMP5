[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "django>=5.2,<5.3",
    "django-celery-beat>=2.9.0",
    "djangorestframework>=3.18.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.5",
    "redis>=8.1.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
]
